[package]
name = "message-android"
version = "0.1.0"
edition = "2024"

[lib]
name = "message_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
message-core = { path = "../message-core" }
jni = { version = "0.21", default-features = false }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"
anyhow = "1.0"

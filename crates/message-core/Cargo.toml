[package]
name = "message-core"
version = "0.1.0"
edition = "2021"

[dependencies]
iroh = "1.2.0"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
hex = "0.4"
parking_lot = "0.12"
futures-util = "0.3"
blake3 = "1.5"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
iroh-ping = "1.0.0"

[dev-dependencies]
tempfile = "3.12"

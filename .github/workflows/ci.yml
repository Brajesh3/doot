name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust Quality Gate & Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            target_name: doot-linux-x64
            desktop_bin: target/release/message-desktop
            bot_bin: target/release/message-bot
            out_desktop: doot-desktop-linux-x64
            out_bot: doot-bot-linux-x64
          - os: windows-latest
            name: Windows x64
            target_name: doot-windows-x64
            desktop_bin: target/release/message-desktop.exe
            bot_bin: target/release/message-bot.exe
            out_desktop: doot-desktop-windows-x64.exe
            out_bot: doot-bot-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Build Release Binaries
        run: cargo build --release -p message-desktop -p message-bot

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.desktop_bin }}" "dist/${{ matrix.out_desktop }}"
          cp "${{ matrix.bot_bin }}" "dist/${{ matrix.out_bot }}"

      - name: Upload Binaries (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: dist/*

  android-build:
    name: Android Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Native Android JNI Library
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CC_aarch64_linux_android="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo build --target aarch64-linux-android -p message-android --release
          mkdir -p android-test/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libmessage_jni.so android-test/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests
        working-directory: ./android-test
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest

      - name: Build Android Debug APK
        working-directory: ./android-test
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doot-messenger-android-debug
          path: android-test/app/build/outputs/apk/debug/app-debug.apk

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            desktop_artifact: doot-desktop-windows-x64.exe
            bot_artifact: doot-bot-windows-x64.exe
            desktop_path: target/release/message-desktop.exe
            bot_path: target/release/message-bot.exe
          - os: ubuntu-24.04
            desktop_artifact: doot-desktop-linux-x64
            bot_artifact: doot-bot-linux-x64
            desktop_path: target/release/message-desktop
            bot_path: target/release/message-bot

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Build Desktop Release
        run: |
          cargo build --release -p message-desktop
          cargo build --release -p message-bot

      - name: Prepare Binaries
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.desktop_path }}" "dist/${{ matrix.desktop_artifact }}"
          cp "${{ matrix.bot_path }}" "dist/${{ matrix.bot_artifact }}"

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doot-desktop-${{ matrix.os }}
          path: dist/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Rust & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Compile Native Android JNI Library
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CC_aarch64_linux_android="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo build --target aarch64-linux-android -p message-android --release
          mkdir -p android-test/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libmessage_jni.so android-test/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: ./android-test
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Asset
        shell: bash
        run: |
          mkdir -p dist
          cp android-test/app/build/outputs/apk/debug/app-debug.apk dist/doot-android-debug.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doot-android-debug
          path: dist/doot-android-debug.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
